# Production topology. Standalone: do NOT combine with docker-compose.yml or docker-compose.vps.yml (those are
# development files and are unchanged). Usage and the full procedure: docs/PRODUCTION_INFRASTRUCTURE.md
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml config -q     # validate
#   docker compose --env-file .env.production -f docker-compose.prod.yml build
#
# Nothing here is started automatically by this repository; deployment is an owner-approved manual step.
# NEVER run `docker compose down -v` against this stack: it deletes the postgres_data volume.

name: vedzmani-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # No `ports:` on purpose: PostgreSQL is reachable only from the internal network.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No `ports:` on purpose. Redis holds only cache and rate-limit counters, so no persistence is configured.
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    image: vedzmani-backend:${RELEASE_TAG:?set RELEASE_TAG (commit SHA)}
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS}
      AUTH_TRUSTED_PROXY_COUNT: "1"
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Sends an allowed Host header: under prod settings a bare localhost Host is rejected with 400.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/health/', headers={'Host': '${PRIMARY_HOST:-vedzmani.ir}'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: vedzmani-frontend:${RELEASE_TAG:?set RELEASE_TAG (commit SHA)}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
    networks: [internal]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro
      # Directory holding origin.pem and origin.key, outside the repository and never committed.
      - ${ORIGIN_CERT_DIR:?set ORIGIN_CERT_DIR}:/etc/nginx/certs:ro
    networks: [edge, internal]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-off operations. Never started by `up`: run explicitly, once per release, after a verified backup:
  #   docker compose --env-file .env.production -f docker-compose.prod.yml --profile ops run --rm migrate-plan
  #   docker compose --env-file .env.production -f docker-compose.prod.yml --profile ops run --rm migrate
  migrate-plan:
    profiles: ["ops"]
    image: vedzmani-backend:${RELEASE_TAG:?set RELEASE_TAG (commit SHA)}
    restart: "no"
    command: ["python", "manage.py", "migrate", "--plan"]
    environment: &ops_env
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS}
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  migrate:
    profiles: ["ops"]
    image: vedzmani-backend:${RELEASE_TAG:?set RELEASE_TAG (commit SHA)}
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *ops_env
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  edge: {}
  internal: {}

volumes:
  postgres_data:
