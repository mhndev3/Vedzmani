upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Product images share a persistent Docker volume with the backend.
    location ^~ /media/ {
        alias /var/www/vedzmani-media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/   { proxy_pass http://backend; }

    # Django Admin is not part of the public product. Staff use the Persian storefront workspace.
    # Keep /api/admin/ available for the authenticated storefront management UI.
    location ^~ /admin/ { return 404; }

    location / { proxy_pass http://frontend; }
}