upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

# Throttle password guessing on the Django Admin login (customers use OTP; only staff have passwords).
# Only POST requests get a key; GET (the login page) maps to an empty key and is never limited.
# The key is the client address Nginx itself sees: behind a CDN/WAF that is the edge address until
# the real client IP is restored (ngx_http_realip_module), so revisit with the final topology.
map $request_method $admin_login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $admin_login_limit_key zone=admin_login:1m rate=10r/m;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Product images share a persistent Docker volume with the backend.
    location ^~ /media/ {
        alias /var/www/vedzmani-media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/   { proxy_pass http://backend; }

    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
    }
    location /admin/ { proxy_pass http://backend; }

    location / { proxy_pass http://frontend; }
}