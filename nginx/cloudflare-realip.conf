# Cloudflare real-IP include for nginx/prod.conf. Committed EMPTY on purpose: the address ranges belong to
# Cloudflare and change, so they are generated at deploy time, never guessed. Until they are added, Nginx
# trusts no forwarded header and per-IP OTP rate limits will see Cloudflare's edge address
# (safe, but all visitors share limits). Before launch, replace this file's content with:
#
#   set_real_ip_from <each range from https://www.cloudflare.com/ips-v4>;
#   set_real_ip_from <each range from https://www.cloudflare.com/ips-v6>;
#   real_ip_header CF-Connecting-IP;
#   real_ip_recursive off;
#
# (one set_real_ip_from line per range), then `docker compose ... exec nginx nginx -t && ... nginx -s reload`.
# Keep AUTH_TRUSTED_PROXY_COUNT=1 (see .env.production.example).
