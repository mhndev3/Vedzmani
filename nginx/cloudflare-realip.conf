# Cloudflare real-IP include for nginx/prod.conf.
#
# STATE OF THIS COMMITTED FILE: PLACEHOLDER. It contains no directives, so Nginx trusts no forwarded header and
# real client IP restoration is NOT active when the file is used as it is: every visitor appears with a
# Cloudflare edge address, and per-address limits (admin-login throttle, OTP rate limits) are shared between
# visitors. That is safe but coarse.
#
# Cloudflare's address ranges change, so they are never committed here. Generate the real include on the
# server (public lists only, no credentials) and mount that file over /etc/nginx/cloudflare-realip.conf:
#
#   python3 scripts/cloudflare_realip.py generate --output <server-path>/cloudflare-realip.conf
#   python3 scripts/cloudflare_realip.py check <server-path>/cloudflare-realip.conf --require-populated --max-age-days 45
#
# The generated file trusts CF-Connecting-IP only from a connection that comes from a Cloudflare range.
# Procedure, limits and what remains unverified: docs/PRODUCTION_INFRASTRUCTURE.md, section 4.
# Keep AUTH_TRUSTED_PROXY_COUNT=1 (see .env.production.example).
