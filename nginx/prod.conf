# Production Nginx topology (used only by docker-compose.prod.yml; development keeps nginx/default.conf).
#
# Browser --HTTPS--> Cloudflare (SSL/TLS mode "Full (strict)") --HTTPS--> this Nginx (origin certificate)
#
# TLS ends HERE, so $scheme is truthful and Django's SECURE_SSL_REDIRECT / SECURE_PROXY_SSL_HEADER work
# unchanged (no redirect loop). Do NOT use Cloudflare "Flexible": it talks plain HTTP to the origin, which
# makes Django see every request as http and redirect it to itself forever.
# See docs/PRODUCTION_INFRASTRUCTURE.md.

upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

# Throttle password guessing on the Django Admin login (same rule as nginx/default.conf).
# Only POST requests get a key. The key is the address Nginx sees: once cloudflare-realip.conf is filled in,
# that is the real client address; until then it is a Cloudflare edge address (shared limit, safe but coarse).
map $request_method $admin_login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $admin_login_limit_key zone=admin_login:1m rate=10r/m;

# Port 80: container health check, and a redirect to the canonical HTTPS host for anything else.
# The target is fixed (not $host) so a forged Host header cannot turn this into an open redirect.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / { return 301 https://vedzmani.ir$request_uri; }
}

# Port 443, unknown or missing server name: refuse the TLS handshake (no certificate is offered).
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name vedzmani.ir www.vedzmani.ir;
    server_tokens off;
    client_max_body_size 10m;

    # Cloudflare Origin CA certificate (or any valid certificate), mounted read-only from the host.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Real client IP behind Cloudflare. The include holds the Cloudflare ranges (generated from
    # cloudflare.com/ips-v4 and /ips-v6 by scripts/cloudflare_realip.py; docs section 4). The committed file is a
    # placeholder with no directives: no header is trusted and real client IP restoration is NOT active.
    include /etc/nginx/cloudflare-realip.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite, never append: a client-supplied X-Forwarded-For must not choose its own rate-limit identity.
    # With one trusted hop (this Nginx) the backend keeps AUTH_TRUSTED_PROXY_COUNT=1.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Product images are stored on the host-mounted media directory shared with the backend.
    # The path is immutable by storage key, so browsers/CDNs can cache it for a year.
    location ^~ /media/ {
        alias /var/www/vedzmani-media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/    { proxy_pass http://backend; }
    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
    }
    location /admin/  { proxy_pass http://backend; }
    # Django Admin static files (WhiteNoise inside the backend, filled by collectstatic at image build).
    location /static/ { proxy_pass http://backend; }

    location / { proxy_pass http://frontend; }
}
