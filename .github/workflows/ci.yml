name: CI

# Quality gates that must pass before code reaches main: frontend (lint, typecheck, build) and backend
# (Django checks, migration consistency, pytest on PostgreSQL). Any failing command fails its job.
#
# Triggers: every pull request, plus pushes to main (re-checks the merged result). Branch pushes are NOT a
# trigger: with `push: agent/**` as well, every push to a branch that has an open PR ran the whole workflow
# twice (once per event). A branch without a pull request therefore gets no CI run until one is opened.
# There are deliberately no path filters, so these jobs always report a status on a pull request.
#
# Only `pull_request` is used (never `pull_request_target`): pull requests from forks run with a read-only
# token and no repository secrets. This workflow needs no secrets; every value below is a throwaway.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          API_INTERNAL_URL: http://localhost:8000

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Only PostgreSQL is started: config.settings.test keeps PostgreSQL as the database engine (no alternate
    # engine). There is no Redis service because that settings module replaces the Redis cache with an
    # in-memory one; REDIS_URL below is only needed so the shared settings module can be imported.
    # The database is a throwaway container that lives for this job only. No external or shared database
    # (VPS, development or production) is ever used.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vedzmani
          POSTGRES_USER: vedzmani
          POSTGRES_PASSWORD: vedzmani
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vedzmani"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://vedzmani:vedzmani@localhost:5432/vedzmani
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: python manage.py check
      - name: Production settings deployment check (no database contact)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-prod-deploy-check-key-not-a-secret-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: shop.example.test
          # prod.py keeps HSTS at 0 until HTTPS is verified end to end. These CI-only values only stop the
          # HSTS warnings (W004/W005/W021) from failing this job; every other deploy warning still fails it.
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  # Production Compose/Nginx validation. Everything is throwaway: values come from .env.production.example with
  # placeholders replaced by dummies, the TLS certificate is generated inside the job, and the Cloudflare ranges
  # come from offline test fixtures. No secrets, VPS, Cloudflare account or dashboard is used, and nothing is
  # deployed. See scripts/validate_prod_stack.py for exactly what is and is not proven. The job pulls the pinned
  # nginx image from Docker Hub.
  prod-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config, nginx -t and real-IP behavior (isolated)
        run: python3 scripts/validate_prod_stack.py
