name: E2E

# Runs every spec in e2e/tests (purchase journey, checkout, catalog, storefront, smoke, sign-in) on a
# disposable Compose stack. Each run starts from empty volumes (own project name, `up` on a fresh runner VM,
# `down -v` at the end), migrates, and seeds e2e/seed_catalog.py, so no state survives between runs and
# concurrent runs cannot share a database. Dev-only OTP delivery (ConsoleDelivery) is used: no SMS is sent and
# no real data is involved. It is a separate workflow from CI, so it does not change the existing
# backend/frontend checks. A workflow_dispatch-only file on a non-default branch cannot be dispatched
# (GitHub returns 404 until it is on the default branch), so it also runs on pull requests. The path filters
# below cover the E2E files and the inputs the stack is built from (backend, frontend, nginx, the base
# Compose file and .env.example), so application changes are exercised before and after merge; a push to
# main re-checks the merged result. Docs-only changes do not trigger it. Keep it out of required checks until
# it has a track record.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/**"
      - ".github/workflows/e2e.yml"
      - "backend/**"
      - "frontend/**"
      - "nginx/**"
      - "docker-compose.yml"
      - ".env.example"
  push:
    branches: [main]
    paths:
      - "e2e/**"
      - ".github/workflows/e2e.yml"
      - "backend/**"
      - "frontend/**"
      - "nginx/**"
      - "docker-compose.yml"
      - ".env.example"

# Least privilege: the job only reads the repository. Fork pull requests run with a read-only token and no
# secrets (this workflow uses `pull_request`, never `pull_request_target`, and needs no secrets).
permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes. Runs on main are never cancelled.
# Every run is isolated anyway (own runner VM, own Compose stack, `down -v` in an `always()` step), so
# cancelling cannot leave state behind for the next run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: vedzmani-ci-e2e
      HTTP_PORT: "8091"
    steps:
      - uses: actions/checkout@v4

      - name: Write throwaway stack config (CI-only values, not secrets)
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^HTTP_PORT=.*|HTTP_PORT=8091|" \
            -e "s|^CORS_ALLOWED_ORIGINS=.*|CORS_ALLOWED_ORIGINS=http://localhost:8091|" \
            -e "s|^CSRF_TRUSTED_ORIGINS=.*|CSRF_TRUSTED_ORIGINS=http://localhost:8091|" \
            -e "s|^NEXT_PUBLIC_API_URL=.*|NEXT_PUBLIC_API_URL=http://localhost:8091|" \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-e2e-throwaway|" \
            -e "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=ci-e2e-not-a-secret|" \
            .env
          # Postgres and Redis are published on loopback only, so e2e/e2e_helper.py (checkout tests) can
          # reach the same throwaway database as the server from the runner.
          cat > "$RUNNER_TEMP/compose.test.yml" <<'EOF'
          services:
            postgres:
              ports: !override
                - "127.0.0.1:55432:5432"
            redis:
              ports:
                - "127.0.0.1:56379:6379"
            backend:
              environment:
                OTP_REQUEST_IP_LIMIT: "1000"
                OTP_VERIFY_IP_LIMIT: "1000"
          EOF

      - name: Start isolated stack
        run: docker compose -f docker-compose.yml -f "$RUNNER_TEMP/compose.test.yml" up -d --build --wait

      - name: Migrate and seed the throwaway database
        run: |
          C="docker compose -f docker-compose.yml -f $RUNNER_TEMP/compose.test.yml"
          $C exec -T backend python manage.py migrate --noinput
          $C cp e2e/seed_catalog.py backend:/tmp/seed_catalog.py
          # E2E_THROWAWAY_DB=1: this stack was created seconds ago on a fresh runner (see the header comment).
          $C exec -T -e E2E_THROWAWAY_DB=1 backend python manage.py shell -c "exec(open('/tmp/seed_catalog.py', encoding='utf-8').read())"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install backend requirements (for the e2e_helper.py session helper)
        run: pip install -r backend/requirements/dev.txt

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install E2E dependencies (frozen lockfile) and Chromium
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: List discovered tests
        working-directory: e2e
        run: pnpm exec playwright test --list

      - name: Run all E2E specs
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8091
          E2E_OTP_LOG_COMMAND: docker compose -p vedzmani-ci-e2e logs --no-color backend
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          # e2e_helper.py runs on the runner against the SAME throwaway database/secret as the server.
          # E2E_THROWAWAY_DB is the operator confirmation e2e_helper.py requires; here the database is the
          # loopback-published throwaway Postgres above.
          E2E_THROWAWAY_DB: "1"
          E2E_BACKEND_DIR: ${{ github.workspace }}/backend
          E2E_PYTHON: python
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DJANGO_SECRET_KEY: ci-e2e-not-a-secret
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:8091
          CSRF_TRUSTED_ORIGINS: http://localhost:8091
          DATABASE_URL: postgres://vedzmani:ci-e2e-throwaway@127.0.0.1:55432/vedzmani
          REDIS_URL: redis://127.0.0.1:56379/0
        run: pnpm exec playwright test --reporter=github,json

      - name: Verify the required specs really ran and passed (not skipped)
        if: always()
        working-directory: e2e
        run: node scripts/report-summary.mjs results.json

      # Artifact contents, reviewed on purpose: Playwright traces (`trace: retain-on-failure` in
      # playwright.config.ts) can contain cookies, request bodies (OTP codes, phone numbers, delivery details)
      # and page snapshots. Here every one of those values belongs to a stack created seconds earlier from
      # CI-only throwaway secrets, synthetic users and synthetic delivery data, and that stack is destroyed by
      # `down -v` in this same job, so no captured session, OTP or database outlives the run. Keep it that way:
      # never add `.env`, backend or compose logs, or a real/shared environment to this upload, and never point
      # this workflow at a real database or a real SMS provider. Retention is kept short for the same reason.
      - name: Upload Playwright traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/test-results
            e2e/results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Show backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f "$RUNNER_TEMP/compose.test.yml" logs --no-color --tail=200 backend

      - name: Remove the throwaway stack and its volumes
        if: always()
        run: docker compose -f docker-compose.yml -f "$RUNNER_TEMP/compose.test.yml" down -v
