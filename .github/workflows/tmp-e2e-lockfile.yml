name: tmp-e2e-lockfile
# TEMPORARY: generates e2e/pnpm-lock.yaml from the real registry (registries are unreachable from the
# authoring sandbox). Removed in the next commit after the lockfile is committed.
on:
  push:
    paths:
      - ".github/workflows/tmp-e2e-lockfile.yml"
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: e2e
        run: |
          pnpm --version
          pnpm install --lockfile-only
          wc -c pnpm-lock.yaml
          echo "::notice title=lockfile-b64::$(base64 -w0 pnpm-lock.yaml)"
